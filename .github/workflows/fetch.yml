name: update-data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch site data
        run: node fetch.mjs

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "ledger-bot"
            git config user.email "ledger-bot@users.noreply.github.com"
            git add data.json
            git commit -m "chore: update data.json $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
            echo committed
          else
            echo "no change"
          fi
